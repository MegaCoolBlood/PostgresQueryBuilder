<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table View</title>
    <style>/* CSS_PLACEHOLDER */</style>
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <div class="toolbar-left">
                <span class="table-name" id="tableName"></span>
                <span class="row-count" id="rowCount"></span>
                <span class="loading-indicator" id="dataLoading"><span class="spinner"></span> Loading data...</span>
                <span class="loading-indicator" id="metaLoading"><span class="spinner"></span> Loading relations...</span>
            </div>
            <div class="toolbar-right">
                <button class="btn btn-primary" id="insertRowBtn" title="Insert new row">+ Insert Row</button>
                <button class="btn btn-success" id="commitBtn" title="Save all changes" disabled>Save</button>
                <button class="btn btn-warning" id="discardBtn" title="Discard all changes" disabled>Discard Changes</button>
                <button class="btn btn-default" id="loadMoreBtn" title="Load more rows">Load More</button>
            </div>
        </div>
        <div class="query-bar">
            <input type="text" id="queryInput" class="query-input" />
            <button class="btn btn-primary" id="queryRunBtn" title="Run query">&#9654; Run</button>
        </div>
        <div class="table-wrapper" id="tableWrapper">
            <table id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="status-bar" id="statusBar">
            <span id="changeCount">No pending changes</span>
        </div>
        <!-- Context Menu -->
        <div class="context-menu" id="contextMenu" style="display:none;">
            <ul id="contextMenuItems"></ul>
        </div>
        <!-- SQL Preview Dialog -->
        <div class="sql-dialog-overlay" id="sqlDialogOverlay" style="display:none;">
            <div class="sql-dialog">
                <div class="sql-dialog-header">
                    <span>SQL Preview</span>
                    <button class="sql-dialog-close" id="sqlDialogClose">&times;</button>
                </div>
                <pre class="sql-dialog-content" id="sqlDialogContent"></pre>
                <div class="sql-dialog-footer">
                    <button class="btn btn-success" id="sqlDialogExecute">Execute</button>
                    <button class="btn btn-default" id="sqlDialogCancel">Cancel</button>
                </div>
            </div>
        </div>
    </div>
    <script>/* JS_PLACEHOLDER */</script>
</body>
</html>
