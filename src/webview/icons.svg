<!--
  Icon sprite shared by every webview. Inlined at the top of <body> so the
  <use href="#icon-..."> references resolve inside the same document, which
  keeps the strict `default-src 'none'` CSP intact.

  The symbols carry geometry only; stroke, fill and size come from the `.ico`
  class in shared.css, so every icon follows the surrounding text colour.
  A path marked `class="f"` is filled instead of stroked.
-->
<svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="icon-add" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
    <symbol id="icon-check" viewBox="0 0 16 16"><path d="M3 8.5l3.5 3.5L13 4.5"/></symbol>
    <symbol id="icon-undo" viewBox="0 0 16 16"><path d="M3.5 7.5h6.5a3 3 0 010 6H7.5"/><path d="M6 5L3.5 7.5 6 10"/></symbol>
    <symbol id="icon-filter" viewBox="0 0 16 16"><path d="M2.5 3.5h11l-4.2 5v4.3l-2.6 1.2V8.5z"/></symbol>
    <symbol id="icon-export" viewBox="0 0 16 16"><path d="M8 2.5v7.5"/><path d="M5 7.5L8 10.5l3-3"/><path d="M3 12v1.5h10V12"/></symbol>
    <symbol id="icon-run" viewBox="0 0 16 16"><path class="f" d="M5 3.2l7.5 4.8L5 12.8z"/></symbol>
    <symbol id="icon-format" viewBox="0 0 16 16"><path d="M3 4h10M3 8h7M3 12h9"/></symbol>
    <symbol id="icon-star" viewBox="0 0 16 16"><path d="M8 2.4l1.7 3.6 3.8.5-2.8 2.7.7 3.9L8 11.2l-3.4 1.9.7-3.9L2.5 6.5l3.8-.5z"/></symbol>
    <symbol id="icon-history" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 4.8V8l2.2 1.4"/></symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 16 16"><path d="M4 6.5L8 10.5l4-4"/></symbol>
    <symbol id="icon-close" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 16 16"><path d="M3.5 4.5h9"/><path d="M6.5 4.5V3h3v1.5"/><path d="M5 4.5l.6 9h4.8l.6-9"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 16 16"><path d="M10.8 2.5l2.7 2.7-8 8H2.8v-2.7z"/></symbol>
    <symbol id="icon-goto" viewBox="0 0 16 16"><path d="M8 3.5H3.5v9h9V8"/><path d="M9.5 3.5h3v3"/><path d="M12.5 3.5L7.5 8.5"/></symbol>
    <symbol id="icon-arrow-down" viewBox="0 0 16 16"><path d="M8 3v8"/><path d="M4.5 7.5L8 11l3.5-3.5"/></symbol>
    <symbol id="icon-arrow-down-line" viewBox="0 0 16 16"><path d="M8 2.5v6.5"/><path d="M5 6L8 9l3-3"/><path d="M3.5 12.5h9"/></symbol>
    <symbol id="icon-database" viewBox="0 0 16 16"><path d="M3 4c0-1 2.2-1.7 5-1.7S13 3 13 4v8c0 1-2.2 1.7-5 1.7S3 13 3 12z"/><path d="M3 4c0 1 2.2 1.7 5 1.7S13 5 13 4"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 16 16"><path d="M5.5 5.5h7v8h-7z"/><path d="M10.5 5.5V2.5h-7v8h2"/></symbol>
    <symbol id="icon-plug" viewBox="0 0 16 16"><path d="M6 2v3M10 2v3"/><path d="M4.5 5h7v2.5a3.5 3.5 0 01-7 0z"/><path d="M8 11v3"/></symbol>
    <symbol id="icon-params" viewBox="0 0 16 16"><path d="M2.5 5h6M11.5 5h2M2.5 11h2M7.5 11h6"/><circle cx="10" cy="5" r="1.5"/><circle cx="6" cy="11" r="1.5"/></symbol>
    <symbol id="icon-grip" viewBox="0 0 16 16"><path class="f" d="M6 3.2a1 1 0 110 2 1 1 0 010-2zM10 3.2a1 1 0 110 2 1 1 0 010-2zM6 7a1 1 0 110 2 1 1 0 010-2zM10 7a1 1 0 110 2 1 1 0 010-2zM6 10.8a1 1 0 110 2 1 1 0 010-2zM10 10.8a1 1 0 110 2 1 1 0 010-2z"/></symbol>
</svg>
